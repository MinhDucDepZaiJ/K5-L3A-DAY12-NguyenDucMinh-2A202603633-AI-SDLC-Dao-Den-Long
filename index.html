<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
:root{color-scheme:dark;--panel:#131728ed;--line:#66556a;--gold:#ffd083;--muted:#d3c4d8}
*{box-sizing:border-box}
body{margin:0;background:#0c1022;color:#fff4df;font:16px system-ui}
canvas{display:block;width:100vw;height:100dvh;touch-action:none;cursor:grab}
canvas.orbiting{cursor:grabbing}
.panel,dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px #09071955}
header{position:fixed;top:16px;left:16px;padding:14px 16px;width:min(350px,calc(100vw - 150px));min-width:185px}
h1,h2,p{margin:0}
h1{font:700 clamp(1.05rem,3vw,1.55rem) system-ui}
.location{color:var(--gold);font-size:.78rem;margin-bottom:3px}
dl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 0}
dl div{background:#25263b;border-radius:8px;padding:6px;min-width:0}
dt{color:var(--muted);font-size:.7rem}
dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.goal{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-size:.8rem}
progress{width:42px;height:8px;accent-color:var(--gold)}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid transparent;border-radius:9px;padding:9px 12px;background:var(--gold);color:#241b2f}
button:focus-visible,summary:focus-visible{outline:3px solid #fff4df;outline-offset:3px}
button.secondary{background:#292942;border-color:var(--line);color:#fff4df}
#pause{position:fixed;top:16px;right:16px}
#status{position:fixed;bottom:88px;left:50%;translate:-50%;width:max-content;max-width:calc(100vw - 32px);padding:9px 14px;text-align:center;border-radius:12px;background:#191a2eee;color:var(--gold)}
#status:empty{display:none}
footer{position:fixed;bottom:16px;inset-inline:16px;width:fit-content;max-width:calc(100% - 32px);padding:9px 12px}
summary{cursor:pointer;color:var(--gold);font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:.78rem;color:var(--muted)}
kbd{background:#2d2b42;color:#fff4df;border-radius:4px;padding:2px 4px}
dialog{width:min(410px,calc(100% - 32px));color:#fff4df;text-align:center;padding:24px}
dialog::backdrop{background:#090a18aa}
dialog p{margin:10px 0 18px;color:var(--muted)}
@media(max-width:560px){dl{grid-template-columns:repeat(2,1fr)}footer{bottom:8px}#status{top:50%;bottom:auto}}

:root{--line:#f2c14e;--gold:#f2c14e}body,dialog{color:#f5f1e6}
#clock{position:fixed;top:16px;left:50%;translate:-50%;padding:8px 13px;font-weight:700;font-variant-numeric:tabular-nums}
#results{min-width:136px;position:fixed;top:66px;right:16px;padding:8px 12px;color:#f2c14e}
#slots{position:fixed;bottom:18px;left:50%;translate:-50%;display:flex;gap:4px;padding:7px;pointer-events:none}
#slots span{width:clamp(6px,1.15vw,12px);height:16px;border:1px solid #c9b48a;border-radius:3px}
#slots .filled{background:#ffe58a}
#cooldowns{position:fixed;right:16px;bottom:16px;font-size:.78rem;padding:8px;pointer-events:none}
#arrow{position:fixed;top:42%;left:50%;font-size:1.5rem;color:#f2c14e;pointer-events:none}
#dialog-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
#settings label{display:block;margin-bottom:8px}
.accessible-palette .urgent{color:#fff}
.accessible-palette .urgent::before{content:"⚠ "}
.urgent{color:#ff5a5f;animation:warning 1s ease-in-out infinite alternate}
@keyframes warning{to{opacity:.6}}
.game-paused .urgent{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.urgent{animation:none}}
@media(max-width:900px){#slots{bottom:112px}#cooldowns{bottom:145px}}
@media(max-width:560px){header{width:185px;min-width:0}#results{top:62px}#clock{top:130px}}
.benchmark :is(header,footer,#pause,#status,#clock,#results,#slots,#cooldowns,#arrow){display:none}
.benchmark canvas{width:1280px;height:720px}
html{font-size:18px}
body,button,summary,input,h1,.location,dt,.goal,.controls,#cooldowns{font-size:1rem}
.large-text :is(button,summary,input,h1,.location,dt,dd,.goal,.controls,#cooldowns,#clock,#results,#status,dialog,#subtitles){font-size:1.25rem}
.reduce-motion .urgent{animation:none}
#key-list{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:6px 0}
dialog{max-height:92dvh;overflow:auto;width:min(510px,calc(100% - 32px))}
#score-name{width:10em;padding:6px}#score-form{margin-top:12px}
#rank-list{text-align:left}
#subtitles{position:fixed;top:92px;left:50%;translate:-50%;background:#131728ed;padding:6px 12px;border-radius:8px}
#subtitles:empty{display:none}
#shade-arrow{position:fixed;translate:-50% -50%;font-size:1.65rem;color:#ff5a5f;pointer-events:none;text-shadow:0 0 6px #131728}
.accessible-palette #shade-arrow{color:#fff}
.benchmark :is(#subtitles,#shade-arrow){display:none}
</style>
<canvas aria-label="Sân chơi Đêm 1"></canvas>
<header class="panel" aria-label="Tiến độ màn chơi">
  <p class="location">Đêm 1 · Đảo Bến</p>
  <h1>Đảo Đèn Lồng</h1>
  <dl>
    <div><dt>Lửa</dt><dd id="flames">—</dd></div>
    <div><dt>Đom đóm</dt><dd id="motes">—</dd></div>

  </dl>
</header>
<div id="clock" class="panel"><span id="time">—</span></div>
<div id="results" class="panel">Điểm <strong id="score">—</strong><div class="goal"><span>Thắp đèn <strong id="lanterns">0/5</strong> · Cần <strong id="goal">3</strong></span><progress id="progress" value="0" max="5" aria-label="Số đèn đã thắp"></progress></div></div>
<div id="slots" class="panel" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div id="cooldowns" class="panel"></div>
<div id="arrow" hidden aria-label="Hướng đến đèn chưa thắp">▲</div>
<button id="pause" type="button" aria-keyshortcuts="Escape">⏸ Tạm dừng</button>
<div id="shade-arrow" hidden aria-hidden="true">▲</div>
<div id="subtitles" role="status"></div>
<p id="status" role="status"></p>
<footer class="panel">
  <details open>
    <summary>Điều khiển</summary>
    <div class="controls">
      <span><kbd data-key="up">W</kbd> <kbd data-key="left">A</kbd> <kbd data-key="down">S</kbd> <kbd data-key="right">D</kbd> Di chuyển</span>
      <span>Kéo chuột / <kbd>Q</kbd> <kbd>Z</kbd> Xoay camera</span>
      <span><kbd data-key="jump">Space</kbd> Nhảy</span>
      <span><kbd data-key="interact">E</kbd> Nạp đèn</span>
      <span><kbd data-key="pulse">F</kbd> Tỏa sáng</span>
      <span><kbd data-key="dash">Shift</kbd> Lướt</span><span><kbd data-key="pause">Esc</kbd> Tạm dừng</span>
    </div>
  </details>
</footer>
<dialog aria-labelledby="dialog-title">
  <h2 id="dialog-title"></h2>
  <p id="dialog-detail"></p>
  <div id="settings" hidden>
    <label>Âm lượng <input id="volume" type="range" min="0" max="1" step=".05" value=".4"></label>
    <label>Độ nhạy chuột <input id="sensitivity" type="range" min=".25" max="2" step=".05" value="1"></label>
    <label><input id="accessible-palette" type="checkbox"> Bảng màu dễ phân biệt</label>
    <label><input id="reduce-motion" type="checkbox"> Giảm chuyển động</label>
    <label><input id="large-text" type="checkbox"> Chữ lớn ×1,25</label>
    <details><summary>Đổi phím</summary><div id="key-list"></div>
      <button id="reset-keys" class="secondary" type="button">Khôi phục mặc định</button>
      <p id="key-notice" role="status"></p>
    </details>
  </div>
  <form id="score-form" hidden>
    <label for="score-name">Tên xếp hạng</label>
    <input id="score-name" required minlength="3" maxlength="12">
    <button type="submit">Lưu điểm</button>
    <p id="score-message" role="status"></p>
  </form>
  <ol id="rank-list" hidden></ol>
  <button id="dialog-action"  type="button" autofocus></button>
  <div id="dialog-actions"></div>
</dialog>
<script type="module" src="./view.mjs"></script>
</html>
