<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
:root{color-scheme:dark;--panel:#131728ed;--line:#66556a;--gold:#ffd083;--muted:#d3c4d8}
*{box-sizing:border-box}
body{margin:0;background:#0c1022;color:#fff4df;font:16px system-ui}
canvas{display:block;width:100vw;height:100dvh;touch-action:none;cursor:grab}
canvas.orbiting{cursor:grabbing}
.panel,dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 28px #09071955}
header{position:fixed;top:16px;left:16px;padding:14px 16px;width:min(350px,calc(100vw - 150px));min-width:185px}
h1,h2,p{margin:0}
h1{font:700 clamp(1.05rem,3vw,1.55rem) system-ui}
.location{color:var(--gold);font-size:.78rem;margin-bottom:3px}
dl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 0}
dl div{background:#25263b;border-radius:8px;padding:6px;min-width:0}
dt{color:var(--muted);font-size:.7rem}
dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums}
.goal{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px;font-size:.8rem}
progress{width:44%;height:8px;accent-color:var(--gold)}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid transparent;border-radius:9px;padding:9px 12px;background:var(--gold);color:#241b2f}
button:focus-visible,summary:focus-visible{outline:3px solid #fff4df;outline-offset:3px}
button.secondary{background:#292942;border-color:var(--line);color:#fff4df}
#pause{position:fixed;top:16px;right:16px}
#status{position:fixed;bottom:88px;left:50%;translate:-50%;width:max-content;max-width:calc(100vw - 32px);padding:9px 14px;text-align:center;border-radius:12px;background:#191a2eee;color:var(--gold)}
#status:empty{display:none}
footer{position:fixed;bottom:16px;inset-inline:16px;width:fit-content;max-width:calc(100% - 32px);padding:9px 12px}
summary{cursor:pointer;color:var(--gold);font-weight:700}
.controls{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:.78rem;color:var(--muted)}
kbd{background:#2d2b42;color:#fff4df;border-radius:4px;padding:2px 4px}
dialog{width:min(410px,calc(100% - 32px));color:#fff4df;text-align:center;padding:24px}
dialog::backdrop{background:#090a18aa}
dialog p{margin:10px 0 18px;color:var(--muted)}
@media(max-width:560px){dl{grid-template-columns:repeat(2,1fr)}footer{bottom:8px}#status{top:50%;bottom:auto}}
</style>
<canvas aria-label="Sân chơi Đêm 1"></canvas>
<header class="panel" aria-label="Tiến độ màn chơi">
  <p class="location">Đêm 1 · Đảo Bến</p>
  <h1>Đảo Đèn Lồng</h1>
  <div class="goal"><span>Thắp đèn <strong id="lanterns">0/5</strong></span><progress id="progress" value="0" max="5" aria-label="Số đèn đã thắp"></progress></div>
  <dl>
    <div><dt>Lửa</dt><dd id="flames">—</dd></div>
    <div><dt>Đom đóm</dt><dd id="motes">—</dd></div>
    <div><dt>Còn lại</dt><dd id="time">—</dd></div>
    <div><dt>Điểm</dt><dd id="score">—</dd></div>
  </dl>
</header>
<button id="pause" type="button" aria-keyshortcuts="Escape">⏸ Tạm dừng</button>
<p id="status" role="status"></p>
<footer class="panel">
  <details open>
    <summary>Điều khiển</summary>
    <div class="controls">
      <span><kbd>WASD</kbd> Di chuyển</span>
      <span>Kéo chuột / <kbd>Q</kbd> <kbd>Z</kbd> Xoay camera</span>
      <span><kbd>Space</kbd> Nhảy</span>
      <span><kbd>E</kbd> Nạp đèn</span>
      <span><kbd>F</kbd> Tỏa sáng</span>
      <span><kbd>Esc</kbd> Tạm dừng</span>
    </div>
  </details>
</footer>
<dialog aria-labelledby="dialog-title">
  <h2 id="dialog-title"></h2>
  <p id="dialog-detail"></p>
  <button id="dialog-action" type="button" autofocus></button>
</dialog>
<script type="module" src="./view.mjs"></script>
</html>
